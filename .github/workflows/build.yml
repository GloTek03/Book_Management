name: Build and Test bookservice

on:
  push:
    branches: [ main, master, dev-deploy-test ]
  pull_request:
    branches: [ main, master, dev-deploy-test ]

jobs:
  build-bookservice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookservice  # 👈 chạy mọi lệnh bên trong thư mục bookservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('bookservice/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (skip tests)
        run: mvn -B clean install -DskipTests=true

      # Nếu bạn muốn chạy test sau này, hãy bỏ dòng skipTests
      # - name: Run tests
      #   run: mvn test
